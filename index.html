// ===== Backend =====
function handleUnauthorized(){try{localStorage.removeItem(LS_KEY);localStorage.removeItem(LS_UNLOCKED);}catch(e){}window.location.reload();}
async function callBackend(action, params={}) {
  const all={action,key:getKey(),...params};
  const query=Object.entries(all).map(([k,v])=>`${encodeURIComponent(k)}=${encodeURIComponent(typeof v==="object"?JSON.stringify(v):v)}`).join("&");
  const res=await fetch(`${APPS_SCRIPT_URL}?${query}`,{method:"GET"});
  const data=await res.json();
  if(data.error==="Unauthorized"&&action!=="ping"){handleUnauthorized();throw new Error("Unauthorized");}
  if(data.error)throw new Error(data.error);
  return data;
}
// POST for big payloads (AI prompts) — keeps them out of the URL
async function postBackend(action, params={}) {
  const res=await fetch(APPS_SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,key:getKey(),...params})});
  const data=await res.json();
  if(data.error==="Unauthorized"){handleUnauthorized();throw new Error("Unauthorized");}
  if(data.error)throw new Error(data.error);
  return data;
}
async function uploadImageBackend(params){
  const res=await fetch(APPS_SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"uploadImage",key:getKey(),...params})});
  const data=await res.json();
  if(data.error)throw new Error(data.error);
  return data;
}

const HASH_PALETTE = [

// Default category colors map
const DEFAULT_CAT_COLORS = {
  Friends:"#D9C3F4", Family:"#FBD0D0", Work:"#C8E6D1",
  Clients:"#B9D4EC", Personal:"#FFD5BF", Health:"#C8E6D1",
  Community:"#BD9CE2", School:"#F5D982"
};

function hashColor(id) {
  let h=0; for(let i=0;i<id.length;i++) h=(h*31+id.charCodeAt(i))&0xFFFFFF;
  return HASH_PALETTE[Math.abs(h)%HASH_PALETTE.length];
}
// Luminance-based text color: dark text on light bg, white on dark/saturated bg
function textOnColor(hex) {
  if(!hex||hex[0]!=="#") return P.text;
  const r=parseInt(hex.slice(1,3),16)/255;
  const g=parseInt(hex.slice(3,5),16)/255;
  const b=parseInt(hex.slice(5,7),16)/255;
  const toLinear=c=>c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4);
  const L=0.2126*toLinear(r)+0.7152*toLinear(g)+0.0722*toLinear(b);
  return L>0.38?"rgba(61,32,48,0.82)":"rgba(255,255,255,0.92)";
}

// ===== Helpers =====
function calcAge(b){if(!b)return null;const bd=new Date(b);if(isNaN(bd.getTime()))return null;const now=new Date();let age=now.getFullYear()-bd.getFullYear();if(now.getMonth()-bd.getMonth()<0||(now.getMonth()===bd.getMonth()&&now.getDate()<bd.getDate()))age--;return age;}
// Sheet dates arrive as full ISO timestamps (UTC); turn them into a local YYYY-MM-DD
function toYMD(v){if(!v)return"";const s=String(v);if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const d=new Date(s);if(isNaN(d.getTime()))return"";const z=n=>String(n).padStart(2,"0");return`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;}
function formatDate(iso){if(!iso)return"";const d=new Date(iso);if(isNaN(d.getTime()))return iso;return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});}
function daysSinceLastAbout(node){if(!node.about?.length)return null;const latest=node.about.reduce((a,b)=>new Date(a.date)>new Date(b.date)?a:b);return Math.floor((Date.now()-new Date(latest.date))/86400000);}

function categoryColorFor(cat) {
  if(cat?.color) return cat.color;
  return DEFAULT_CAT_COLORS[cat?.name] || hashColor(cat?.id || "x");
}
function personBaseColor(nodeId, allLinks, allNodes) {
  // find the first category link for this person
  const cl = allLinks.find(l => {
    const catId = l.source===nodeId?l.target:l.target===nodeId?l.source:null;
    return catId && allNodes.find(n=>n.id===catId)?.type==="category";
  });
  if(cl) {
    const catId = cl.source===nodeId?cl.target:cl.source;
    const cat = allNodes.find(n=>n.id===catId);
    return categoryColorFor(cat);
  }
  // No category: borrow the color of a linked person who has one
  const viaPerson=allLinks.find(l=>{const o=l.source===nodeId?l.target:l.target===nodeId?l.source:null;
    return o&&allNodes.find(n=>n.id===o)?.type==="person"&&allLinks.some(m=>(m.target===o||m.source===o)&&allNodes.find(n=>n.id===(m.target===o?m.source:m.target))?.type==="category");});
  if(viaPerson){const o=viaPerson.source===nodeId?viaPerson.target:viaPerson.source;return personBaseColor(o,allLinks.filter(l=>l!==viaPerson),allNodes);}
  return hashColor(nodeId);
}
function nodeMainColor(node, allLinks, allNodes) {
  if(node.id==="me") return P.youFill;
  if(node.type==="category") return categoryColorFor(node);
  if(node.type==="collection") return node.color||"#BD9CE2";
  if(node.type==="item") return allNodes.find(n=>n.id===collectionNodeId(node.collection))?.color||collectionDef(node.collection)?.color||"#D9C3F4";
  return personBaseColor(node.id, allLinks, allNodes);
}

// ===== Obsidian-style node radius =====
function getNodeRadius(node, centerId, isL2, allLinks) {
  if(node.id===centerId) return 36;
  if(isL2) return 10;
  if(node.type==="category") return 26;
  if(node.type==="collection") return node.id==="collections"?26:22;
  if(node.type!=="person") return 14;
  const connCount = allLinks ? allLinks.filter(l=>(l.source===node.id||l.target===node.id)&&l.type!=="circle").length : 0;
  const aboutCount = node.about ? node.about.length : 0;
  const days = daysSinceLastAbout(node);
  const recencyBonus = days===null ? 0 : days<7 ? 4 : days<30 ? 2 : days<90 ? 1 : 0;
  const featuredBonus = node.featured ? 8 : 0;
  const radius = 12 + Math.min(connCount*2,8) + Math.min(aboutCount*1.5,8) + recencyBonus + featuredBonus;
  return Math.min(Math.round(radius), 36);
}

// ===== Smart Reminders =====
function localYMD(d){const z=n=>String(n).padStart(2,"0");return`${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`;}
function getReminders(nodes, fieldDefs) {
  const t = new Date(); const now = new Date(t.getFullYear(), t.getMonth(), t.getDate()); // today, 00:00 local
  const reminders = [];
  nodes.filter(n=>n.type==="person"&&n.birthday).forEach(n=>{
    const b = new Date(n.birthday); if(isNaN(b.getTime())) return;
    let next = new Date(now.getFullYear(), b.getMonth(), b.getDate());
    if(next<now) next = new Date(now.getFullYear()+1, b.getMonth(), b.getDate());
    const daysUntil = Math.round((next-now)/86400000);
    if(daysUntil<=7) reminders.push({
      id:`bday_${n.id}_${next.getFullYear()}`, personId:n.id, personName:n.name,
      type:"birthday", emoji:"🎂", dayOf:localYMD(next),
      label:daysUntil===0?`${n.name.split(" ")[0]}'s birthday is TODAY!`:daysUntil===1?`${n.name.split(" ")[0]}'s birthday is tomorrow`:`${n.name.split(" ")[0]}'s birthday in ${daysUntil} days`,
      daysUntil,
    });
  });
  if(fieldDefs) {
    nodes.filter(n=>n.type==="person").forEach(n=>{
      (n.importantFieldIds||[]).forEach(fid=>{
        const fd = fieldDefs.find(f=>f.id===fid); if(!fd) return;
        const val = n.customValues?.[fid]; if(!val) return;
        const dateVal = new Date(val); if(isNaN(dateVal.getTime())) return;
        let nextOccurrence = new Date(now.getFullYear(), dateVal.getMonth(), dateVal.getDate());
        if(nextOccurrence<now) nextOccurrence = new Date(now.getFullYear()+1, dateVal.getMonth(), dateVal.getDate());
        const daysUntil = Math.round((nextOccurrence-now)/86400000);
        if(daysUntil<=3) reminders.push({
          id:`field_${n.id}_${fid}_${nextOccurrence.getFullYear()}`, personId:n.id, personName:n.name,
          type:"custom", emoji:"📅", dayOf:localYMD(nextOccurrence),
          label:daysUntil===0?`${fd.label} for ${n.name.split(" ")[0]} — TODAY`:`${fd.label} for ${n.name.split(" ")[0]} in ${daysUntil} day${daysUntil===1?"":"s"}`,
          daysUntil,
        });
      });
    });
  }
  return reminders.sort((a,b)=>a.daysUntil-b.daysUntil);
}
function getDismissedReminders(){try{return JSON.parse(localStorage.getItem(LS_DISMISSED_REMINDERS)||"{}");}catch(e){return{};}}
// Dismiss: never show this reminder again (ids include the year, so next year's birthday still shows)
function dismissReminder(id){try{const d=getDismissedReminders();d[id]="done";localStorage.setItem(LS_DISMISSED_REMINDERS,JSON.stringify(d));}catch(e){}}
// Remind me on the day: hide until the day itself
function snoozeReminder(id,dayOf){try{const d=getDismissedReminders();d[id]="snooze_"+dayOf;localStorage.setItem(LS_DISMISSED_REMINDERS,JSON.stringify(d));}catch(e){}}
function isReminderActive(reminder){const d=getDismissedReminders();const val=d[reminder.id];if(!val)return true;if(val.startsWith("snooze_")){return localYMD(new Date())>=val.replace("snooze_","");}return false;}

// Returns true if a node has a category as a direct parent (other than "me")
function hasCatParent(id,allNodes,allLinks){
  return allLinks.some(l=>
    l.target===id&&l.source!=="me"&&allNodes.find(n=>n.id===l.source)?.type==="category"
  );
}
// A person "has a place" if they're in a category, or linked to a person who has a place
function personInCategory(id,allNodes,allLinks){
  return allLinks.some(l=>{const o=l.source===id?l.target:l.target===id?l.source:null;return o&&allNodes.find(n=>n.id===o)?.type==="category";});
}
function placedPeople(allNodes,allLinks){
  const people=allNodes.filter(n=>n.type==="person");
  const placed=new Set(people.filter(p=>personInCategory(p.id,allNodes,allLinks)).map(p=>p.id));
  const isPerson=new Set(people.map(p=>p.id));
  let changed=true;
  while(changed){changed=false;allLinks.forEach(l=>{
    if(!isPerson.has(l.source)||!isPerson.has(l.target))return;
    if(placed.has(l.source)&&!placed.has(l.target)){placed.add(l.target);changed=true;}
    else if(placed.has(l.target)&&!placed.has(l.source)){placed.add(l.source);changed=true;}
  });}
  return placed;
}
function getNeighborGraph(centerId,allNodes,allLinks){
  const nIds=new Set([centerId]);
  const nLinks=[];
  allLinks.forEach(l=>{
    if(l.source===centerId&&l.target!=="me"){nIds.add(l.target);nLinks.push(l);}
    if(l.target===centerId&&l.source!=="me"){nIds.add(l.source);nLinks.push(l);}
  });
  // From home: hide persons/sub-cats that belong under a category
  const filteredNodes=centerId==="me"
    ?allNodes.filter(n=>nIds.has(n.id))
    :allNodes.filter(n=>nIds.has(n.id)&&n.id!=="me");
  const filteredIds=new Set(filteredNodes.map(n=>n.id));
  return{neighborNodes:filteredNodes,neighborLinks:nLinks.filter(l=>filteredIds.has(l.source)&&filteredIds.has(l.target)),secondLevelIds:new Set()};
}
function getTwoLevelGraph(centerId,allNodes,allLinks){
  const l1=new Set([centerId]);const l2=new Set();const usedSet=new Set();const used=[];
  const isHome=centerId==="me";
  function addLink(l){if(!usedSet.has(l)){usedSet.add(l);used.push(l);}}
  allLinks.forEach(l=>{
    if(l.source===centerId&&l.target!=="me"){
      const targetNode=allNodes.find(n=>n.id===l.target);
      if(isHome&&targetNode?.type==="person"){/* skip — shown via category */}
      else{l1.add(l.target);addLink(l);}
    }
    if(l.target===centerId&&l.source!=="me"){
      const sourceNode=allNodes.find(n=>n.id===l.source);
      if(isHome&&sourceNode?.type==="person"){/* skip */}
      else{l1.add(l.source);addLink(l);}
    }
  });
  // Inside a category: only branch DOWNWARD (parent -> child), and never expand
  // the node we came from (otherwise its other children would show up here)
  const parents=new Set();
  if(!isHome)allLinks.forEach(l=>{
    if(l.target===centerId&&l.source!=="me"&&["category","collection"].includes(allNodes.find(n=>n.id===l.source)?.type))parents.add(l.source);
  });
  allLinks.forEach(l=>{
    if(!isHome){
      if(l1.has(l.source)&&l.source!==centerId&&!parents.has(l.source)&&!l1.has(l.target)&&l.target!=="me"){
        const pn=allNodes.find(n=>n.id===l.source),cn=allNodes.find(n=>n.id===l.target);
        if(!cn)return;
        if(["category","collection"].includes(pn?.type)){l2.add(l.target);addLink(l);return;}
      }
      // A person without a category hangs behind the person they're linked to
      [[l.source,l.target],[l.target,l.source]].forEach(([p,c])=>{
        if(!l1.has(p)||p===centerId||l1.has(c)||l2.has(c)||c==="me")return;
        const pn=allNodes.find(n=>n.id===p),cn=allNodes.find(n=>n.id===c);
        if(pn?.type==="person"&&cn?.type==="person"&&!personInCategory(c,allNodes,allLinks)){l2.add(c);addLink(l);}
      });
      return;
    }
    const inL1s=l1.has(l.source)&&l.source!==centerId;
    const inL1t=l1.has(l.target)&&l.target!==centerId;
    if(inL1s&&!l1.has(l.target)&&l.target!=="me"){
      const tn=allNodes.find(n=>n.id===l.target);
      const parentNode=allNodes.find(n=>n.id===l.source);
      if(parentNode?.type==="person"&&tn?.type==="person")return;
      l2.add(l.target);addLink(l);
    }
    if(inL1t&&!l1.has(l.source)&&l.source!=="me"){
      const sn=allNodes.find(n=>n.id===l.source);
      const parentNode=allNodes.find(n=>n.id===l.target);
      if(parentNode?.type==="person"&&sn?.type==="person")return;
      l2.add(l.source);addLink(l);
    }
  });
  const all=new Set([...l1,...l2]);
  // From home: hide persons/sub-cats that belong under a category
  const filteredNodes=centerId==="me"
    ?allNodes.filter(n=>all.has(n.id))
    :allNodes.filter(n=>all.has(n.id)&&n.id!=="me");
  const filteredIds=new Set(filteredNodes.map(n=>n.id));
  const filteredL2=new Set([...l2].filter(id=>filteredIds.has(id)));
  return{neighborNodes:filteredNodes,neighborLinks:used.filter(l=>filteredIds.has(l.source)&&filteredIds.has(l.target)),secondLevelIds:filteredL2};
}

// ===== Layout =====
// Stable radial layout:
//  - Every first-level node gets a fixed ANGLE around the center.
//    The angle is saved in localStorage, so it is the same after refresh.
//  - Children (sub-categories / people) fan out from their parent,
//    in the same direction (away from the center), like branches.
const LS_LAYOUT_ANGLES = "peopleapp_layout_angles_v1";
function loadAngles(){try{return JSON.parse(localStorage.getItem(LS_LAYOUT_ANGLES)||"{}");}catch(e){return{};}}
function saveAngles(a){try{localStorage.setItem(LS_LAYOUT_ANGLES,JSON.stringify(a));}catch(e){}}
function hashAngle(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return((h>>>0)/4294967296)*Math.PI*2;}
const TAU=Math.PI*2;
function normAngle(a){a%=TAU;return a<0?a+TAU:a;}

// Spread angles so no two are closer than `gap`, but keep their order
function spreadAngles(items,gap){
  if(items.length<2)return;
  const g=Math.min(gap,TAU/items.length*0.98);
  for(let it=0;it<200;it++){
    items.sort((a,b)=>a.angle-b.angle);
    let moved=false;
    for(let i=0;i<items.length;i++){
      const a=items[i],b=items[(i+1)%items.length];
      let diff=b.angle-a.angle;if(i===items.length-1)diff+=TAU;
      if(diff<g-1e-4){const push=(g-diff)/2;a.angle=normAngle(a.angle-push);b.angle=normAngle(b.angle+push);moved=true;}
    }
    if(!moved)break;
  }
}

function computeLayout(centerId,allNodes,allLinks,width,height,twoLevel,prevPositions){
  const{neighborNodes,neighborLinks,secondLevelIds}=twoLevel?getTwoLevelGraph(centerId,allNodes,allLinks):getNeighborGraph(centerId,allNodes,allLinks);
  const pos={};
  const cx=width/2,cy=height/2+10;
  const padX=44,padTop=70,padBot=36;
  const nodeIds=new Set(neighborNodes.map(n=>n.id));

  // 1. First-level nodes (direct neighbours of the center)
  const l1=neighborNodes.filter(n=>n.id!==centerId&&!secondLevelIds.has(n.id));

  // 2. Children of each first-level node (only in two-level view)
  const childrenOf={};const parentOf={};
  if(twoLevel){
    neighborLinks.forEach(l=>{
      let p=null,c=null;
      if(secondLevelIds.has(l.target)&&!secondLevelIds.has(l.source)&&l.source!==centerId){p=l.source;c=l.target;}
      else if(secondLevelIds.has(l.source)&&!secondLevelIds.has(l.target)&&l.target!==centerId){p=l.target;c=l.source;}
      if(p&&c&&!parentOf[c]){parentOf[c]=p;(childrenOf[p]=childrenOf[p]||[]).push(c);}
    });
    // stable child order
    Object.values(childrenOf).forEach(arr=>arr.sort((a,b)=>hashAngle(a)-hashAngle(b)));
  }
  const hasChildren=Object.keys(childrenOf).length>0;

  // 3. Angles: saved angle if we have one, otherwise a fixed hash of the id
  const saved=loadAngles();
  const viewKey=centerId+"|";
  const items=l1.map(n=>{
    const k=viewKey+n.id;
    return{id:n.id,angle:typeof saved[k]==="number"?saved[k]:hashAngle(n.id)};
  });
  // bigger gap for nodes that have a fan of children
  const isHomeView=centerId==="me";
  const ringOf={}; // per-node ring size (1 = normal)
  if(isHomeView){
    spreadAngles(items,hasChildren?0.95:0.55);
    items.forEach(it=>{saved[viewKey+it.id]=it.angle;});
    saveAngles(saved);
  }else{
    // Inside a group/person: parent group straight up, sub-groups beside it in
    // the upper half, people (and items) close together in the lower half
    const D=Math.PI/180;
    const typeOf=id=>allNodes.find(n=>n.id===id)?.type;
    const isGroup=id=>["category","collection"].includes(typeOf(id));
    const parentSet=new Set(neighborLinks.filter(l=>l.target===centerId&&isGroup(l.source)).map(l=>l.source));
    const byHash=(a,b)=>hashAngle(a.id)-hashAngle(b.id);
    const parents=items.filter(it=>parentSet.has(it.id)).sort(byHash);
    const groups=items.filter(it=>!parentSet.has(it.id)&&isGroup(it.id)).sort(byHash);
    const others=items.filter(it=>!parentSet.has(it.id)&&!isGroup(it.id)).sort(byHash);
    const top=[...parents,...groups];
    if(top.length){
      // parents take the middle slots, sub-groups fill both sides
      const order=[];const mid=(top.length-1)/2;
      const slots=top.map((_,i)=>i).sort((a,b)=>Math.abs(a-mid)-Math.abs(b-mid)||a-b);
      parents.forEach((it,i)=>order[slots[i]]=it);
      let gi=0;slots.slice(parents.length).sort((a,b)=>a-b).forEach(sl=>{order[sl]=groups[gi++];});
      const span=others.length?Math.min(160,top.length===1?0:52*(top.length-1)):Math.min(300,top.length===1?0:60*(top.length-1));
      order.forEach((it,i)=>{it.angle=(-90-span/2+(top.length===1?0:span*i/(top.length-1)))*D;});
    }
    if(others.length){
      const n=others.length;
      const step=n>10?16:n>6?22:30;                  // degrees between neighbours
      const span=top.length?Math.min(150,step*(n-1)):Math.min(320,step*(n-1));
      const mid=top.length?90:-90;
      others.forEach((it,i)=>{
        it.angle=(mid-span/2+(n===1?0:span*i/(n-1)))*D;
        ringOf[it.id]=n>10?(i%2?1.0:0.72):0.8;       // closer to the center; two rows when crowded
      });
    }
  }

  // 4. Ring size (ellipse that fits the screen)
  const childDist=twoLevel&&hasChildren?78:0;
  const rx=Math.max(90,Math.min(width/2-padX-childDist-10,320));
  const ry=Math.max(110,Math.min((height-padTop-padBot)/2-childDist-10,300));
  const ringScale=l1.length<=2?0.85:1;

  pos[centerId]={x:cx,y:cy};
  const angleOf={};
  items.forEach(it=>{
    angleOf[it.id]=it.angle;
    if(isHomeView){
      const rs=ringScale*(ringOf[it.id]||1);
      pos[it.id]={x:cx+Math.cos(it.angle)*rx*rs,y:cy+Math.sin(it.angle)*ry*rs};
    }else{
      // compact circle inside groups, so lines stay short
      const r=Math.max(120,Math.min(width/2-55,(height-padTop-padBot)/2-60,170))*(ringOf[it.id]||1);
      pos[it.id]={x:cx+Math.cos(it.angle)*r,y:cy+Math.sin(it.angle)*r};
    }
  });

  // 5. Children fan out from their parent, pointing AWAY from the center
  Object.entries(childrenOf).forEach(([pid,kids])=>{
    const pp=pos[pid];if(!pp)return;
    const base=Math.atan2(pp.y-cy,pp.x-cx);
    const n=kids.length;
    const spread=Math.min(Math.PI*0.9,0.55*(n-1)); // total fan width
    const dist=childDist+Math.max(0,n-5)*6;
    kids.forEach((cid,i)=>{
      const a=n===1?base:base-spread/2+spread*(i/(n-1));
      pos[cid]={x:pp.x+Math.cos(a)*dist,y:pp.y+Math.sin(a)*dist};
    });
  });
  // L2 nodes without a known parent: put them on an outer ring
  neighborNodes.forEach(n=>{
    if(pos[n.id])return;
    const a=hashAngle(n.id);
    pos[n.id]={x:cx+Math.cos(a)*(rx+40),y:cy+Math.sin(a)*(ry+40)};
  });

  // 6. Small push-apart so circles don't overlap (deterministic, keeps directions)
  const ids=neighborNodes.map(n=>n.id).filter(id=>id!==centerId);
  const rad={};neighborNodes.forEach(n=>{rad[n.id]=getNodeRadius(n,centerId,secondLevelIds.has(n.id),allLinks);});
  for(let it=0;it<40;it++){
    for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){
      const a=ids[i],b=ids[j];
      const dx=pos[b].x-pos[a].x,dy=pos[b].y-pos[a].y;
      const d=Math.sqrt(dx*dx+dy*dy)||0.01;
      const min=rad[a]+rad[b]+14;
      if(d<min){
        const push=(min-d)/2;
        const wa=secondLevelIds.has(a)?1:0.3,wb=secondLevelIds.has(b)?1:0.3;
        pos[a].x-=dx/d*push*wa;pos[a].y-=dy/d*push*wa;
        pos[b].x+=dx/d*push*wb;pos[b].y+=dy/d*push*wb;
      }
    }
    // keep away from the center circle
    ids.forEach(id=>{
      const dx=pos[id].x-cx,dy=pos[id].y-cy;const d=Math.sqrt(dx*dx+dy*dy)||0.01;
      const min=rad[centerId]+rad[id]+30;
      if(d<min){pos[id].x=cx+dx/d*min;pos[id].y=cy+dy/d*min;}
    });
  }

  // 7. Keep everything on screen
  ids.forEach(id=>{
    pos[id].x=Math.max(padX,Math.min(width-padX,pos[id].x));
    pos[id].y=Math.max(padTop,Math.min(height-padBot,pos[id].y));
  });

  // Animation start: previous spot, or grow out from the parent / center
  const startPos={};
  neighborNodes.forEach(n=>{
    if(prevPositions&&prevPositions[n.id])startPos[n.id]={...prevPositions[n.id]};
    else{const p=parentOf[n.id]&&prevPositions?.[parentOf[n.id]];startPos[n.id]=p?{...p}:{x:cx,y:cy};}
  });
  return{finalPos:pos,startPos,neighborNodes,neighborLinks,secondLevelIds};
}

function useAnimatedLayout(centerId,allNodes,allLinks,width,height,twoLevel,newNodeId,stablePosRef){
  const[positions,setPositions]=useState({});
  const frameRef=useRef(null);
  const[pulseScale,setPulseScale]=useState({});
  const lastRef=useRef({key:null,pos:{}});
  // re-run when the data changes too (new person / category), not only on navigation
  const dataKey=allNodes.length+":"+allLinks.length+":"+allNodes.map(n=>n.id).join(",").length;
  useEffect(()=>{
    if(!width||!height)return;
    const viewKey=centerId+"|"+twoLevel;
    // same view (data changed) -> animate from where nodes are now; new view -> grow from center
    const seed=lastRef.current.key===viewKey?lastRef.current.pos:null;
    const{finalPos,startPos,neighborNodes}=computeLayout(centerId,allNodes,allLinks,width,height,twoLevel,seed);
    const ids=neighborNodes.map(n=>n.id);
    const duration=550;const start=performance.now();
    function easeOut(t){return 1-Math.pow(1-t,3);}
    function animate(now){
      const t=Math.min(1,(now-start)/duration);const e=easeOut(t);const interp={};
      ids.forEach(id=>{const s=startPos[id],f=finalPos[id];interp[id]=s&&f?{x:s.x+(f.x-s.x)*e,y:s.y+(f.y-s.y)*e}:f;});
      setPositions(interp);
      lastRef.current={key:viewKey,pos:interp};
      if(t<1)frameRef.current=requestAnimationFrame(animate);
      else if(stablePosRef)stablePosRef.current=finalPos;
    }
    if(frameRef.current)cancelAnimationFrame(frameRef.current);
    frameRef.current=requestAnimationFrame(animate);
    return()=>{if(frameRef.current)cancelAnimationFrame(frameRef.current);};
  },[centerId,width,height,twoLevel,dataKey]);
  useEffect(()=>{
    if(!newNodeId)return;
    let t=0;const iv=setInterval(()=>{t+=0.15;const scale=1+0.3*Math.sin(t)*Math.max(0,1-t/(Math.PI*3));setPulseScale(s=>({...s,[newNodeId]:scale}));if(t>Math.PI*3){setPulseScale(s=>({...s,[newNodeId]:1}));clearInterval(iv);}},30);
    return()=>clearInterval(iv);
  },[newNodeId]);
  return{positions,pulseScale};
}

      {!node?.photo&&node.id!=="me"&&<text textAnchor="middle" dominantBaseline="central" fontSize={isCenter?r*0.5:r*0.55} fontWeight="700" fill={isCenter?P.youText:textOnColor(color)} style={{pointerEvents:"none",userSelect:"none"}}>{initial}</text>}
      {node?.type==="person"&&!isCenter&&(()=>{const days=daysSinceLastAbout(node);if(days===null)return null;const dotColor=days<7?"#90C29E":days<30?"#D9AA48":days<90?"#D9C3F4":P.dim;return(<circle cx={r*0.7} cy={-r*0.7} r={4} fill={dotColor} stroke={P.surface} strokeWidth={1.5}/>);})()}

function Graph({centerId,allNodes,allLinks,onNodeTap,onCenterTap,width,height,twoLevel,newNodeId,selectedId,editMode,onEditNode,stablePosRef}){
  const{neighborNodes,neighborLinks,secondLevelIds}=twoLevel?getTwoLevelGraph(centerId,allNodes,allLinks):getNeighborGraph(centerId,allNodes,allLinks);
  const{positions,pulseScale}=useAnimatedLayout(centerId,allNodes,allLinks,width,height,twoLevel,newNodeId,stablePosRef);
  return(
    <svg width={width} height={height} style={{position:"absolute",inset:0,background:P.bg}}>
      <defs>
        <clipPath id="avatarClip"><circle r="100%"/></clipPath>
      </defs>
      {/* Soft radial glow behind center */}
      <circle cx={width/2} cy={height/2} r={Math.min(width,height)*0.4} fill="url(#glowGrad)" style={{pointerEvents:"none"}}/>
      <defs><radialGradient id="glowGrad"><stop offset="0%" stopColor="#D9C3F4" stopOpacity="0.18"/><stop offset="100%" stopColor="#D9C3F4" stopOpacity="0"/></radialGradient></defs>
      {neighborLinks.map((l,i)=>{
        const sp=positions[l.source],tp=positions[l.target];if(!sp||!tp)return null;
        const isL2=secondLevelIds.has(l.source)||secondLevelIds.has(l.target);
        const sn=neighborNodes.find(n=>n.id===l.source),tn=neighborNodes.find(n=>n.id===l.target);
        const sr=getNodeRadius(sn||{},centerId,secondLevelIds.has(l.source),allLinks)+3;
        const tr=getNodeRadius(tn||{},centerId,secondLevelIds.has(l.target),allLinks)+3;
        const dx=tp.x-sp.x,dy=tp.y-sp.y;const dist=Math.sqrt(dx*dx+dy*dy)||1;
        const x1=sp.x+(dx/dist)*sr,y1=sp.y+(dy/dist)*sr;
        const x2=tp.x-(dx/dist)*tr,y2=tp.y-(dy/dist)*tr;
        const lc=connColor(l.type);
        return<line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke={isL2?(lc||P.link):(lc||P.link)} strokeWidth={isL2?1.0:1.4} strokeOpacity={isL2?0.5:0.65} strokeDasharray={isL2?"4,3":undefined} strokeLinecap="round"/>;
      })}
      {[...neighborNodes.filter(n=>secondLevelIds.has(n.id)),...neighborNodes.filter(n=>!secondLevelIds.has(n.id))].map(n=>{
        const p=positions[n.id];if(!p)return null;
        const isCenter=n.id===centerId,isL2=secondLevelIds.has(n.id),isSelected=n.id===selectedId;
        const r=getNodeRadius(n,centerId,isL2,allLinks);
        const color=nodeMainColor(n,allLinks,allNodes);
        const scale=pulseScale[n.id]||1;
        return(
          <g key={n.id} transform={`translate(${p.x},${p.y}) scale(${scale})`} style={{cursor:"pointer"}}
            onClick={e=>{e.stopPropagation();if(isCenter)onCenterTap(n);else onNodeTap(n);}}
            onTouchEnd={e=>{e.preventDefault();e.stopPropagation();if(isCenter)onCenterTap(n);else onNodeTap(n);}}>
            {isSelected&&<circle r={r+7} fill={P.selectedLight} stroke={P.selected} strokeWidth={1.5}/>}
            <Avatar node={n} r={r} color={color} isCenter={isCenter} isSelected={isSelected}/>
            {!isL2&&n.id!=="me"&&<text y={r+15} textAnchor="middle" fontSize={isCenter?13:10} fontWeight={isCenter?"700":"500"} fill={P.text} style={{pointerEvents:"none",userSelect:"none"}} paintOrder="stroke" stroke={P.bg} strokeWidth={3} strokeLinejoin="round">{n.type==="item"?(n.name.length>16?n.name.slice(0,15)+"…":n.name):n.name.split(" ")[0]}</text>}
            {isL2&&<text y={r+11} textAnchor="middle" fontSize={8} fill={P.muted} style={{pointerEvents:"none",userSelect:"none"}} paintOrder="stroke" stroke={P.bg} strokeWidth={3} strokeLinejoin="round">{n.type==="item"?(n.name.length>16?n.name.slice(0,15)+"…":n.name):n.name.split(" ")[0]}</text>}
          </g>
        );
      })}
    </svg>
  );
}

function LockScreen({onUnlock}){

// ===== Uncategorized Drawer =====
function UncategorizedDrawer({people,allNodes,allLinks,onClose,onSelectPerson}){
  const touchStart=useRef(null);
  const onTouchStart=e=>{touchStart.current=e.touches[0].clientY;};
  const onTouchEnd=e=>{if(touchStart.current!==null&&e.changedTouches[0].clientY-touchStart.current>80)onClose();touchStart.current=null;};
  return(
    <div style={{position:"absolute",inset:0,background:"rgba(61,32,48,0.25)",backdropFilter:"blur(4px)",zIndex:25,display:"flex",alignItems:"flex-end"}} onClick={onClose}>
      <div style={{width:"100%",background:P.surface,borderRadius:"28px 28px 0 0",border:`1.5px solid ${P.border}`,borderBottom:"none",boxShadow:`0 -4px 24px ${P.shadow}`,paddingBottom:40,maxHeight:"70vh",display:"flex",flexDirection:"column"}} onClick={e=>e.stopPropagation()} onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
        <div style={{width:40,height:4,background:P.handleBar,borderRadius:2,margin:"12px auto 8px",flexShrink:0}}/>
        <div style={{padding:"8px 22px 14px",borderBottom:`1px solid ${P.borderSoft}`,flexShrink:0}}>
          <div style={{fontSize:16,fontWeight:700,color:P.text}}>👤 Uncategorized</div>
          <div style={{fontSize:12,color:P.muted,marginTop:2}}>{people.length} {people.length===1?"person":"people"} not in any category</div>
          <div style={{fontSize:12,color:P.muted,marginTop:4}}>Tip: add them to a category, or connect them to someone (Edit → + Add connection)</div>
        </div>
        <div style={{overflowY:"auto",padding:"12px 22px 0",flex:1}}>
          {people.map(n=>{
            const color=personBaseColor(n.id,allLinks,allNodes);
            return(
              <div key={n.id} onClick={()=>{onSelectPerson(n.id);onClose();}} style={{display:"flex",alignItems:"center",gap:12,padding:"11px 0",borderBottom:`1px solid ${P.borderSoft}`,cursor:"pointer"}}>
                <div style={{width:38,height:38,borderRadius:"50%",background:`${color}20`,border:`2px solid ${color}50`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,fontWeight:700,color,flexShrink:0}}>{n.name[0]}</div>
                <div style={{flex:1}}>
                  <div style={{fontSize:15,fontWeight:600,color:P.text}}>{n.name}</div>
                  {n.birthday&&<div style={{fontSize:11,color:P.muted,marginTop:1}}>🎂 {formatDate(n.birthday)}</div>}
                </div>
                <span style={{fontSize:18,color:P.muted}}>›</span>
              </div>
            );
          })}
          {people.length===0&&<div style={{textAlign:"center",padding:"24px 0",color:P.muted,fontSize:14}}>No uncategorized people 🎉</div>}
        </div>
      </div>
    </div>
  );
}

// ===== Quick Note =====
function QuickNoteModal({allNodes,onSave,onCancel}){
  const[search,setSearch]=useState("");const[selectedId,setSelectedId]=useState(null);const[noteDate,setNoteDate]=useState("");const[noteText,setNoteText]=useState("");
  const matches=search.trim()&&!selectedId?allNodes.filter(n=>n.type==="person"&&n.name.toLowerCase().includes(search.toLowerCase())):[];
  const selected=allNodes.find(n=>n.id===selectedId);
  const pColor=selectedId?personBaseColor(selectedId,[],allNodes):P.muted;
  function save(){if(!selectedId||!noteText.trim())return;const date=noteDate||new Date().toISOString().slice(0,10);onSave(selectedId,{date,text:noteText.trim()});}
  return(
    <div onClick={onCancel} style={{position:"absolute",inset:0,background:"rgba(61,32,48,0.3)",backdropFilter:"blur(4px)",zIndex:30,display:"flex",alignItems:"flex-end"}}>
      <div onClick={e=>e.stopPropagation()} style={{width:"100%",background:P.surface,borderRadius:"24px 24px 0 0",border:`1.5px solid ${P.border}`,boxShadow:`0 -4px 24px ${P.shadow}`,padding:"20px 20px 44px"}}>
        <div style={handle}/>
        <div style={{fontSize:17,fontWeight:700,color:P.text,marginBottom:4}}>Quick note</div>
        <div style={{fontSize:13,color:P.muted,marginBottom:14}}>Jot something down in 3 taps.</div>
        {!selectedId?(<>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Who is it about?" autoFocus style={{...inp,marginBottom:10,fontSize:15}}/>
          {matches.map(n=><button key={n.id} onClick={()=>{setSelectedId(n.id);setSearch("");}} style={{textAlign:"left",display:"flex",alignItems:"center",gap:10,width:"100%",padding:"9px 12px",background:P.inputBg,border:`1.5px solid ${P.border}`,borderRadius:12,color:P.text,cursor:"pointer",marginBottom:6,fontFamily:"inherit",fontSize:14}}><div style={{width:26,height:26,borderRadius:"50%",background:`${personBaseColor(n.id,[],allNodes)}25`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:personBaseColor(n.id,[],allNodes)}}>{n.name[0]}</div>{n.name}</button>)}
        </>):(<>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12,padding:"8px 12px",background:P.inputBg,borderRadius:12,border:`1.5px solid ${P.border}`}}>
            <div style={{width:26,height:26,borderRadius:"50%",background:`${pColor}25`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,fontWeight:700,color:pColor}}>{selected?.name[0]}</div>
            <span style={{fontSize:14,color:P.text,flex:1}}>{selected?.name}</span>
            <button onClick={()=>setSelectedId(null)} style={{background:"none",border:"none",color:P.muted,cursor:"pointer",fontSize:18,padding:0}}>×</button>
          </div>
          <input type="date" value={noteDate} onChange={e=>setNoteDate(e.target.value)} style={{...inp,marginBottom:8}}/>
          <textarea value={noteText} onChange={e=>setNoteText(e.target.value)} placeholder="What happened?" autoFocus rows={3} style={{...inp,resize:"none",marginBottom:10,lineHeight:1.5}}/>
          <button onClick={save} style={{...pbtn("primary"),width:"100%",fontSize:15,padding:13,marginBottom:6}}>Save note</button>
        </>)}
        <button onClick={onCancel} style={{width:"100%",padding:13,background:"transparent",color:P.muted,border:"none",fontSize:15,cursor:"pointer",fontFamily:"inherit"}}>Cancel</button>
      </div>
    </div>
  );
}

// ===== AI Chat =====
async function callClaudeAI(message, people, items) {
  const peopleList = people.map(p => `- ${p.name} (id: ${p.id})${p.birthday?`, birthday: ${p.birthday}`:""}${p.about?.length?`, last note: "${p.about[p.about.length-1]?.text}"`:""}`).join("\n");
  const itemList = (items||[]).map(i => `- [${i.collection}] ${i.name} (id: ${i.id})`).join("\n") || "(none yet)";
  const colHelp = COLLECTIONS.map(c => `  ${c.key}: fields ${[...c.fixed,...c.optional].map(f=>f.key+(f.options?` (one of: ${f.options.join("/")})`:f.type==="date"?" (YYYY-MM-DD)":"")).join(", ")||"none"}${c.people?`; linkPeople = people to "${c.people.label}"`:""}`).join("\n");
  const systemPrompt = `You are a personal CRM assistant. The user will tell you something about their life and you must figure out what to save and where.

People in their network:
${peopleList}

Their Collections (${COLLECTIONS.map(c=>c.name.toLowerCase()).join(", ")}):
${itemList}

Collection types and their fields:
${colHelp}

You must respond with ONLY a JSON array (no explanation, no markdown) of actions to take. Each action is one of:
- {"type":"about","personId":"<id>","date":"<YYYY-MM-DD>","text":"<note about this person>"}
- {"type":"birthday","personId":"<id>","date":"<YYYY-MM-DD>"}
- {"type":"field","personId":"<id>","fieldLabel":"<label>","value":"<value>"}
- {"type":"item","collection":"<${COLLECTIONS.map(c=>c.key).join("|")}>","name":"<name>","fields":{...},"note":"<optional note>","linkPeople":["<personId>"]}   (a NEW ${COLLECTIONS.map(c=>c.singular).join("/")})
- {"type":"itemNote","itemId":"<id>","date":"<YYYY-MM-DD>","text":"<note>"}   (a note on an EXISTING item from the list)

Rules:
- If the item already exists in the list, use itemNote, never create a duplicate.
- Today's date is ${new Date().toISOString().slice(0,10)}.
- If nothing matches, return [].
- Only return actions you are confident about.`;
  const data = await postBackend("askClaude", {system:systemPrompt, message});
  const text = (data.text || "[]").replace(/^```(json)?|```$/gm,"").trim();
  try { const arr = JSON.parse(text); return Array.isArray(arr)?arr:[]; } catch(e) { return []; }
}

function AIChatModal({allNodes, onSave, onCancel}) {
  const[text,setText]=useState("");
  const[status,setStatus]=useState("idle");
  const[result,setResult]=useState(null);
  const[errMsg,setErrMsg]=useState("");
  const[listening,setListening]=useState(false);
  const recRef=useRef(null);
  const textareaRef=useRef(null);
  const people=allNodes.filter(n=>n.type==="person");

  function startMic(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){setErrMsg("Speech recognition not supported in this browser.");return;}
    if(recRef.current){recRef.current.stop();return;}
    const rec=new SR();
    rec.lang=navigator.language||"he-IL";
    rec.continuous=false;
    rec.interimResults=false;
    rec.onstart=()=>setListening(true);
    rec.onresult=e=>{
      const t=Array.from(e.results).map(r=>r[0].transcript).join(" ");
      setText(prev=>prev?prev+" "+t:t);
      recRef.current=null;
      setListening(false);
      setTimeout(()=>textareaRef.current?.focus(),50);
    };
    rec.onerror=e=>{setErrMsg("Mic: "+e.error);recRef.current=null;setListening(false);};
    rec.onend=()=>{recRef.current=null;setListening(false);};
    recRef.current=rec;
    rec.start();
  }

  async function send(){
    if(!text.trim())return;
    setStatus("thinking");setResult(null);setErrMsg("");
    try{
      const actions=await callClaudeAI(text.trim(),people,allNodes.filter(n=>n.type==="item"));
      if(!actions||actions.length===0){setStatus("done");setResult([]);return;}
      for(const a of actions){await onSave(a);}
      setResult(actions);setStatus("done");
    }catch(e){setErrMsg(e.message||"Something went wrong");setStatus("error");}
  }
  const personName=(id)=>people.find(p=>p.id===id)?.name||id;
  const itemName=(id)=>allNodes.find(n=>n.id===id)?.name||id;
  function describe(a){
    if(a.type==="about")return `Note for ${personName(a.personId)}: "${a.text}"`;
    if(a.type==="birthday")return `Birthday for ${personName(a.personId)}: ${a.date}`;
    if(a.type==="item"){const d=collectionDef(a.collection);const who=(a.linkPeople||[]).map(personName).join(", ");return `${d?.icon||""} Added ${d?.singular||"item"} "${a.name}"${who?` · ${d?.people?.label||"linked"}: ${who}`:""}`;}
    if(a.type==="itemNote")return `Note on "${itemName(a.itemId)}": "${a.text}"`;
    return `${a.fieldLabel} for ${personName(a.personId)}: ${a.value}`;
  }
  const suggestions=["Had coffee with someone today","Finished a book someone recommended","Save a place I want to visit"];

  return(
    <div style={{position:"absolute",inset:0,background:"rgba(245,240,235,0.65)",backdropFilter:"blur(8px)",zIndex:35,display:"flex",alignItems:"flex-end"}}>
      <div style={{width:"100%",background:P.surface,borderRadius:"28px 28px 0 0",border:`1.5px solid #E8D8F0`,borderBottom:"none",boxShadow:`0 -4px 24px ${P.shadow}`,paddingBottom:44}}>
        <div style={{width:40,height:4,background:P.handleBar,borderRadius:2,margin:"12px auto 12px"}}/>

        {/* AI avatar + title */}
        <div style={{display:"flex",alignItems:"center",gap:10,padding:"0 16px",marginBottom:6}}>
          <div style={{width:28,height:28,borderRadius:"50%",background:`linear-gradient(135deg,${P.aiIcon1},${P.aiIcon2})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,flexShrink:0}}>✦</div>
          <div style={{fontSize:16,fontWeight:700,color:P.text}}>Tell me anything</div>
        </div>
        <div style={{fontSize:13,color:P.muted,padding:"0 16px",marginBottom:12}}>I'll figure out who it's about and save it.</div>

        {/* Mic listening indicator */}
        {listening&&<div style={{margin:"0 16px 10px",padding:"9px 14px",background:"#FBD0D020",border:`1.5px solid ${P.nudgeBorder}`,borderRadius:14,fontSize:13,color:P.youText,display:"flex",alignItems:"center",gap:8}}>
          <span style={{display:"inline-block",width:8,height:8,borderRadius:"50%",background:P.nudgeDot,animation:"pulse 1s infinite"}}/>Listening… speak now
        </div>}
        <style>{`@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}`}</style>

        {/* Result / thinking */}
        {status==="thinking"&&<div style={{textAlign:"center",padding:"12px 16px",color:P.muted,fontSize:14}}>✦ Thinking…</div>}
        {status==="done"&&result!==null&&(
          <div style={{margin:"0 16px 12px",padding:"10px 14px",background:"#F0FBF4",borderRadius:14,border:`1.5px solid #C8E6D1`}}>
            {result.length===0?<div style={{fontSize:13,color:P.muted}}>Couldn't match anything — try being more specific.</div>:result.map((a,i)=>(
              <div key={i} style={{fontSize:13,color:P.text,padding:"3px 0"}}>✓ {describe(a)}</div>
            ))}
          </div>
        )}
        {status==="error"&&<div style={{margin:"0 16px 12px",padding:"10px 14px",background:P.dangerLight,borderRadius:14,border:`1.5px solid ${P.danger}40`,fontSize:13,color:P.danger}}>{errMsg}</div>}

        {/* Action chips (after done) */}
        {status==="done"&&(
          <div style={{display:"flex",gap:8,padding:"0 16px",marginBottom:12}}>
            <button onClick={()=>{setText("");setStatus("idle");setResult(null);setErrMsg("");}} style={{flex:1,padding:"8px 0",background:P.inputBg,border:`1.5px solid ${P.border}`,borderRadius:10,fontSize:13,fontWeight:600,color:P.text,cursor:"pointer",fontFamily:"inherit"}}>Tell me more</button>
            <button onClick={onCancel} style={{flex:1,padding:"8px 0",background:P.btnPrimary,border:"none",borderRadius:10,fontSize:13,fontWeight:600,color:P.btnPrimaryText,cursor:"pointer",fontFamily:"inherit"}}>Done ✓</button>
          </div>
        )}

        {/* Suggestion chips */}
        {status==="idle"&&!text&&(
          <div style={{display:"flex",flexDirection:"column",gap:6,padding:"0 16px",marginBottom:12}}>
            {suggestions.map(s=>(
              <button key={s} onClick={()=>{setText(s);setTimeout(()=>textareaRef.current?.focus(),50);}} style={{background:P.inputBg,border:`1.5px solid #E0D0F0`,borderRadius:14,padding:"9px 14px",fontSize:13,color:"#5A3A80",cursor:"pointer",textAlign:"left",fontFamily:"inherit",lineHeight:1.4}}>💡 {s}</button>
            ))}
          </div>
        )}

        {/* Input row */}
        {status!=="done"&&(
          <div style={{display:"flex",alignItems:"flex-end",gap:10,padding:"0 16px"}}>
            <textarea ref={textareaRef} value={text} onChange={e=>setText(e.target.value)} placeholder="Tell me about someone…" rows={2} autoFocus disabled={status==="thinking"||listening} style={{...inp,resize:"none",lineHeight:1.5,borderColor:listening?"#F39393":"#D9C3F4",flex:1,transition:"border-color 0.2s"}} onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&(e.preventDefault(),send())}/>
            <button onClick={send} disabled={!text.trim()||status==="thinking"} style={{width:44,height:44,borderRadius:14,background:P.btnPrimary,border:"none",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,color:P.btnPrimaryText,flexShrink:0,cursor:"pointer",opacity:!text.trim()||status==="thinking"?0.4:1}}>↑</button>
          </div>
        )}

        {status!=="done"&&<button onClick={onCancel} style={{width:"100%",padding:"12px 0",background:"transparent",color:P.muted,border:"none",fontSize:14,cursor:"pointer",fontFamily:"inherit",marginTop:10}}>Cancel</button>}
      </div>
    </div>
  );
}

// ===== Collections (Books / Places / Recipes) =====
const COLLECTIONS_ROOT = {id:"collections",name:"Collections",type:"collection",color:"#BD9CE2",icon:"✦"};
const COLLECTIONS = [
  {key:"books",name:"Books",singular:"book",color:"#F5D982",icon:"📖",
    fixed:[{key:"author",label:"Author"}],
    optional:[{key:"quote",label:"Quote",multiline:true}],
    people:{type:"Recommend to",label:"Recommend to"}},
  {key:"places",name:"Places",singular:"place",color:"#C8E6D1",icon:"📍",
    fixed:[{key:"location",label:"City / country"},{key:"kind",label:"Type",options:["Restaurant","Café","Bar","Nature","Shop","Hotel","Attraction","Other"]},{key:"when",label:"When",type:"date"}],
    optional:[{key:"mapsUrl",label:"Google Maps link",type:"url"}]},
  {key:"recipes",name:"Recipes",singular:"recipe",color:"#FFD5BF",icon:"🍳",
    fixed:[],
    optional:[{key:"change",label:"Change I made",multiline:true},{key:"link",label:"Recipe link",type:"url"}]},
];
function collectionDef(key){return COLLECTIONS.find(c=>c.key===key);}
function collectionNodeId(key){return "col_"+key;}
function collectionKeyOfNode(node){return node?.type==="collection"&&node.id!=="collections"?node.id.replace(/^col_/,""):null;}
function isUrl(v){return /^https?:\/\//i.test(String(v||"").trim());}
function fieldDisplay(f,v){if(f.type==="date")return formatDate(v);return v;}

function FieldInput({f,value,onChange,autoFocus}){
  if(f.options)return(<select value={value||""} onChange={e=>onChange(e.target.value)} style={{...inp,color:value?P.text:P.muted}}><option value="">{f.label}…</option>{f.options.map(o=><option key={o} value={o}>{o}</option>)}</select>);
  if(f.multiline)return(<textarea value={value||""} onChange={e=>onChange(e.target.value)} rows={3} autoFocus={autoFocus} style={{...inp,resize:"none",lineHeight:1.5}}/>);
  return(<input type={f.type==="date"?"date":f.type==="url"?"url":"text"} value={value||""} onChange={e=>onChange(e.target.value)} placeholder={f.type==="url"?"https://…":""} autoFocus={autoFocus} style={inp}/>);
}

  const[editingNote,setEditingNote]=useState(null);const[editNoteText,setEditNoteText]=useState("");const[editNoteDate,setEditNoteDate]=useState("");
  const baseDef=collectionDef(item.collection)||{name:"Item",singular:"item",color:"#D9C3F4",icon:"•",fixed:[],optional:[]};
  const def={...baseDef,color:allNodes.find(n=>n.id===collectionNodeId(item.collection))?.color||baseDef.color};
  const[editing,setEditing]=useState(false);
  const[draft,setDraft]=useState(null);
  const[showAddField,setShowAddField]=useState(false);
  const[showAddNote,setShowAddNote]=useState(false);const[noteDate,setNoteDate]=useState("");const[noteText,setNoteText]=useState("");
  const[personSearch,setPersonSearch]=useState("");const[showPersonPick,setShowPersonPick]=useState(false);
  const[showDelConfirm,setShowDelConfirm]=useState(false);

  const linkedPeople=allLinks.filter(l=>(l.source===item.id||l.target===item.id)&&l.type===def.people?.type).map(l=>allNodes.find(n=>n.id===(l.source===item.id?l.target:l.source))).filter(n=>n&&n.type==="person");
  const notes=[...(item.about||[])].sort((a,b)=>new Date(b.date)-new Date(a.date));
  const setOptional=def.optional.filter(f=>fields[f.key]);
  function startEdit(){setDraft({name:item.name,fields:{...fields}});setEditing(true);}
  function saveEdit(){
    const clean={};Object.entries(draft.fields).forEach(([k,v])=>{if(v!==undefined&&v!==null&&String(v).trim()!=="")clean[k]=v;});
    // place moved -> forget the saved map position so it's looked up again
    if(clean.location!==fields.location||clean.mapsUrl!==fields.mapsUrl||draft.name!==item.name){delete clean.lat;delete clean.lng;}
    onUpdate(item.id,{name:draft.name.trim()||item.name,fields:clean});setEditing(false);setDraft(null);setShowAddField(false);
  }
  function setField(k,v){setDraft(d=>({...d,fields:{...d.fields,[k]:v}}));}
  function addNote(){if(!noteText.trim())return;onAddNote(item.id,{date:noteDate||new Date().toISOString().slice(0,10),text:noteText.trim()});setNoteText("");setNoteDate("");setShowAddNote(false);}

        <div style={{flex:1}}>
          {editing?<input value={draft.name} onChange={e=>setDraft(d=>({...d,name:e.target.value}))} style={{...inp,fontSize:17,fontWeight:700,background:"transparent",border:"none",borderBottom:`1.5px solid ${P.border}`,borderRadius:0,padding:"4px 0"}}/>:<div style={{fontSize:18,fontWeight:700,color:P.text}}>{item.name}</div>}

const TASK_KEEP_MS=2*24*60*60*1000;
function visibleTasks(tasks){
  const now=Date.now();
  const open=tasks.filter(t=>!t.done);
  const done=tasks.filter(t=>t.done&&!(t.doneAt&&now-new Date(t.doneAt).getTime()>TASK_KEEP_MS))
    .sort((a,b)=>new Date(b.doneAt||0)-new Date(a.doneAt||0));
  return{open,done};
}
function TodoSheet({tasks,onAdd,onToggle,onEdit,onDelete,onClose}){

  function saveEdit(t){const v=editText.trim();if(v&&v!==t.text)onEdit(t.id,v);setEditingId(null);}

            <button aria-label="Delete task" onMouseDown={e=>{e.preventDefault();onDelete(t.id);setEditingId(null);}} style={{...pbtn("danger"),padding:"6px 10px",fontSize:13}}>Delete</button></>

// ===== Places Map =====
function loadLeaflet(){
  if(window.L)return Promise.resolve(window.L);
  if(window._leafletLoading)return window._leafletLoading;
  window._leafletLoading=new Promise((resolve,reject)=>{
    const css=document.createElement("link");css.rel="stylesheet";css.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";document.head.appendChild(css);
    const js=document.createElement("script");js.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";js.onload=()=>resolve(window.L);js.onerror=reject;document.head.appendChild(js);
  });
  return window._leafletLoading;
}
function coordsFromUrl(url){
  const u=String(url||"");
  let m=u.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||u.match(/[?&](?:q|query|ll|center)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/)||u.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
  return m?{lat:parseFloat(m[1]),lng:parseFloat(m[2])}:null;
}
const KIND_COLORS={Restaurant:"#F39393",Café:"#D9AA48",Bar:"#B27CDB",Nature:"#90C29E",Shop:"#B9D4EC",Hotel:"#EBA076",Attraction:"#BD9CE2",Other:"#C898A8"};
function PlacesMap({places,onOpen,onClose,onSaveCoords}){
  const mapEl=useRef(null);const mapRef=useRef(null);const layerRef=useRef(null);
  const[coords,setCoords]=useState(()=>{const c={};places.forEach(p=>{const f=p.fields||{};if(f.lat&&f.lng)c[p.id]={lat:+f.lat,lng:+f.lng};else{const u=coordsFromUrl(f.mapsUrl);if(u)c[p.id]=u;}});return c;});
  const[missing,setMissing]=useState([]);const[looking,setLooking]=useState(0);
  const[kind,setKind]=useState("All");const[err,setErr]=useState("");
  const kinds=["All",...Array.from(new Set(places.map(p=>p.fields?.kind).filter(Boolean)))];
  // init map
  useEffect(()=>{let dead=false;
    loadLeaflet().then(L=>{if(dead||!mapEl.current)return;
      const m=L.map(mapEl.current,{zoomControl:false}).setView([31.8,35],7);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(m);
      L.control.zoom({position:"bottomright"}).addTo(m);
      mapRef.current=m;layerRef.current=L.layerGroup().addTo(m);setCoords(c=>({...c}));
    }).catch(()=>setErr("Couldn't load the map"));
    return()=>{dead=true;if(mapRef.current){mapRef.current.remove();mapRef.current=null;}};
  },[]);
  // look up places that have no position yet (one per second — free OpenStreetMap service)
  useEffect(()=>{let stop=false;
    const todo=places.filter(p=>!coords[p.id]);
    if(!todo.length)return;
    (async()=>{
      const notFound=[];
      for(let i=0;i<todo.length&&!stop;i++){
        const p=todo[i];setLooking(todo.length-i);
        const q=[p.name,p.fields?.location].filter(Boolean).join(", ");
        try{
          const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(q));
          const d=await r.json();
          if(d&&d[0]){const c={lat:+d[0].lat,lng:+d[0].lon};setCoords(x=>({...x,[p.id]:c}));onSaveCoords(p.id,c);}
          else notFound.push(p.name);
        }catch(e){notFound.push(p.name);}
        await new Promise(res=>setTimeout(res,1100));
      }
      if(!stop){setLooking(0);setMissing(notFound);}
    })();
    return()=>{stop=true;};
  },[]);
  // draw markers
  useEffect(()=>{const L=window.L,m=mapRef.current,layer=layerRef.current;if(!L||!m||!layer)return;
    layer.clearLayers();const pts=[];
    places.filter(p=>coords[p.id]&&(kind==="All"||p.fields?.kind===kind)).forEach(p=>{
      const c=coords[p.id];pts.push([c.lat,c.lng]);
      const color=KIND_COLORS[p.fields?.kind]||"#90C29E";
      L.circleMarker([c.lat,c.lng],{radius:9,color:"#fff",weight:2,fillColor:color,fillOpacity:1})
        .bindTooltip(p.name,{direction:"top",offset:[0,-8]}).on("click",()=>onOpen(p.id)).addTo(layer);
    });
    if(pts.length===1)m.setView(pts[0],14);else if(pts.length>1)m.fitBounds(pts,{padding:[40,40],maxZoom:15});
  },[coords,kind]);
  return(
    <div style={{position:"absolute",inset:0,zIndex:45,background:P.bg,display:"flex",flexDirection:"column"}}>
      <div style={{display:"flex",alignItems:"center",gap:10,padding:"14px 16px 8px"}}>
        <button onClick={onClose} style={{width:34,height:34,borderRadius:10,background:P.surface,border:`1.5px solid ${P.border}`,color:P.text,fontSize:15,cursor:"pointer",flexShrink:0}}>←</button>
        <div style={{fontSize:16,fontWeight:700,color:P.text,flex:1}}>📍 Places map</div>
        {looking>0&&<div style={{fontSize:12,color:P.muted}}>Finding {looking}…</div>}
      </div>
      {kinds.length>2&&<div style={{display:"flex",gap:6,padding:"0 16px 10px",overflowX:"auto"}}>
        {kinds.map(k=><button key={k} onClick={()=>setKind(k)} style={{padding:"5px 12px",borderRadius:20,whiteSpace:"nowrap",background:kind===k?(KIND_COLORS[k]||P.btnPrimary):P.surface,border:`1.5px solid ${kind===k?(KIND_COLORS[k]||P.btnPrimary):P.border}`,fontSize:12,color:P.text,cursor:"pointer",fontFamily:"inherit",fontWeight:kind===k?600:400}}>{k}</button>)}
      </div>}
      <div ref={mapEl} style={{flex:1,margin:"0 12px",borderRadius:16,overflow:"hidden",border:`1.5px solid ${P.border}`}}/>
      <div style={{padding:"8px 16px 28px",fontSize:12,color:P.muted,minHeight:20}}>
        {err||(missing.length>0?`Couldn't find on the map: ${missing.join(", ")} — add a Google Maps link to them`:places.length===0?"No places yet":"Tap a dot to open the place")}
      </div>
    </div>
  );
}

      const meNode={id:"me",name:"You",type:"me"};
      // Collections: virtual root + Books/Places/Recipes, items from the Items sheet
      let colColors={};try{colColors=JSON.parse((data.settings||{}).collectionColors||"{}");}catch(e){}
      const colNodes=[{...COLLECTIONS_ROOT,color:colColors.collections||COLLECTIONS_ROOT.color},...COLLECTIONS.map(c=>({id:collectionNodeId(c.key),name:c.name,type:"collection",color:colColors[collectionNodeId(c.key)]||c.color,icon:c.icon,collectionKey:c.key}))];
      const itemNodes=(data.items||[]).filter(it=>collectionDef(it.collection)).map(it=>({id:it.id,name:it.name||"(untitled)",type:"item",collection:it.collection,fields:it.fields||{},about:it.about||[],icon:collectionDef(it.collection).icon}));
      const colLinks=[{source:"me",target:"collections",type:"circle"},...COLLECTIONS.map(c=>({source:"collections",target:collectionNodeId(c.key),type:"circle"})),...itemNodes.map(it=>({source:collectionNodeId(it.collection),target:it.id,type:"item"}))];
      const allPeople=[meNode,...cats,...people,...colNodes,...itemNodes];
      setNodes(allPeople);
      const rels=(data.relationships||[]).map(r=>({source:r.personA,target:r.personB,type:r.type}));
      // Sub-category relationships: cat→cat links stored as type "subcategory" in relationships
      const catIds=new Set(cats.map(c=>c.id));
      const subCatLinks=rels.filter(r=>catIds.has(r.source)&&catIds.has(r.target));
      const subCatChildIds=new Set(subCatLinks.map(r=>r.target));
      // Only link top-level categories (no cat parent) to "me"
      const catLinks=cats.filter(c=>!subCatChildIds.has(c.id)).map(c=>({source:"me",target:c.id,type:"circle"}));
      const peopleLinks=[];
      people.forEach(p=>{
        const pCats=(p.categories||[]).filter(c=>c&&c!=="[]"&&c!=="null"&&c.trim()!=="");
        pCats.forEach(catName=>{const cat=cats.find(c=>c.name===catName);if(cat)peopleLinks.push({source:cat.id,target:p.id,type:catName.toLowerCase()});});
        if(pCats.length===0){peopleLinks.push({source:"me",target:p.id,type:"person"});}
      });
      // Non-subcategory rels (person↔person)
      const personRels=rels.filter(r=>!catIds.has(r.source)||!catIds.has(r.target));
      setLinks([...catLinks,...subCatLinks,...personRels,...peopleLinks,...colLinks]);
      setTasks((data.tasks||[]).map(t=>({...t,done:t.done===true||t.done==="TRUE"||t.done==="true"})));
      setFieldDefs((data.fieldDefs||[]).map(f=>({...f,important:f.important===true||f.important==="TRUE"||f.important==="true"})));
      const allReminders=getReminders(allPeople,data.fieldDefs||[]);
      setActiveReminders(allReminders.filter(isReminderActive));
    }catch(err){setLoadError(err.message||"Couldn't reach your Google Sheet.");}
    finally{setLoading(false);}
  }

  async function updatePerson(id,patch){
    if(patch._newConn){setLinks(prev=>[...prev,{source:id,target:patch._newConn.target,type:patch._newConn.type}]);setSaving(true);try{await callBackend("addRelationship",{personA:id,personB:patch._newConn.target,type:patch._newConn.type});}catch(e){console.error(e);}finally{setSaving(false);}return;}
    if(patch._removeDirectLink){
      setLinks(prev=>prev.filter(l=>!((l.source===id&&l.target==="me")||(l.target===id&&l.source==="me"))));
      setSaving(true);
      try{await callBackend("removeRelationship",{personA:id,personB:"me"});}catch(e){console.error(e);}finally{setSaving(false);}
      return;
    }
    if(patch._assignCategory){
      const{catId,catName}=patch._assignCategory;
      // 1. Add category link in state
      setLinks(prev=>[...prev,{source:catId,target:id,type:catName.toLowerCase()}]);
      // 2. Remove direct me→person link in state
      setLinks(prev=>prev.filter(l=>!((l.source===id&&l.target==="me")||(l.target===id&&l.source==="me"))));
      setSaving(true);
      try{
        // 3. Update People sheet categories column
        await callBackend("addPersonToCategory",{personId:id,categoryName:catName});
        // 4. Remove direct relationship row from Relationships sheet
        await callBackend("removeRelationship",{personA:id,personB:"me"});
      }catch(e){console.error(e);}finally{setSaving(false);}
      return;
    }
    if(patch._removeCategory){
      const{catId,catName}=patch._removeCategory;
      // Remove the category link from state
      setLinks(prev=>prev.filter(l=>!((l.source===id&&l.target===catId)||(l.target===id&&l.source===catId))));
      setSaving(true);
      try{await callBackend("removePersonFromCategory",{personId:id,categoryName:catName});}catch(e){console.error(e);}finally{setSaving(false);}
      return;
    }
    if(patch._newPerson){
      const{name,connType}=patch._newPerson;setSaving(true);
      try{
        const res=await callBackend("addPerson",{name,categories:[]});const newId=res.id;
        setNodes(prev=>[...prev,{id:newId,name,type:"person",birthday:"",about:[],customValues:{},importantFieldIds:[],photo:null}]);
        setLinks(prev=>[...prev,{source:"me",target:newId,type:"person"},{source:id,target:newId,type:connType}]);
        await callBackend("addRelationship",{personA:id,personB:newId,type:connType});
      }catch(e){console.error(e);}finally{setSaving(false);}
      return;
    }
    setNodes(prev=>prev.map(n=>n.id===id?{...n,...patch}:n));
    if(id==="me")return;
    setSaving(true);
    try{
      await callBackend("updatePerson",{id,...(patch.name?{name:patch.name}:{}),...(patch.birthday!==undefined?{birthDate:patch.birthday}:{}),...(patch.featured!==undefined?{featured:patch.featured?"TRUE":""}:{})});
      if(patch.customValues){for(const[fieldId,value]of Object.entries(patch.customValues)){await callBackend("setFieldValue",{personId:id,fieldId,value});}}
      if(patch.about){
        const existing=nodes.find(n=>n.id===id)?.about||[];
        const newEntries=patch.about.filter(e=>!e.id&&!existing.some(x=>x.date===e.date&&x.text===e.text));
        for(const entry of newEntries){const r=await callBackend("addAbout",{personId:id,date:entry.date,text:entry.text});setNoteId(id,entry,r.id);}
        // entries removed in the editor are deleted on the server too
        const removed=existing.filter(x=>x.id&&!patch.about.some(e=>e.id===x.id));
        for(const entry of removed){await callBackend("deleteAbout",{id:entry.id});}
      }
    }catch(e){console.error(e);}finally{setSaving(false);}
  }
  async function deletePerson(id){
    setNodes(prev=>prev.filter(n=>n.id!==id));setLinks(prev=>prev.filter(l=>l.source!==id&&l.target!==id));setActiveCardId(null);
    if(centerId===id){const prev=navStack[navStack.length-1]||"me";setNavStack(s=>s.slice(0,-1));setCenterId(prev);}

  function renameNode(id, newName, isCategory) {
    if(isCategory){
      if(newName===id)return;
      if(nodes.some(n=>n.type==="category"&&n.id===newName)){alert("A category with that name already exists");return;}
      // Categories are identified by their name, so the id changes everywhere
      const sw=x=>x===id?newName:x;
      setNodes(prev=>prev.map(n=>n.id===id?{...n,id:newName,name:newName}:n));
      setLinks(prev=>prev.map(l=>({...l,source:sw(l.source),target:sw(l.target)})));
      setNavStack(st=>st.map(sw));setCenterId(c=>sw(c));
      try{const a=JSON.parse(localStorage.getItem(LS_LAYOUT_ANGLES)||"{}");Object.keys(a).forEach(k=>{const[v,n]=k.split("|");if(v===id||n===id){a[sw(v)+"|"+sw(n)]=a[k];delete a[k];}});localStorage.setItem(LS_LAYOUT_ANGLES,JSON.stringify(a));}catch(e){}
      setSaving(true);
      callBackend("renameCategory",{oldName:id,newName}).catch(e=>console.error(e)).finally(()=>setSaving(false));
    } else {
      setNodes(prev=>prev.map(n=>n.id===id?{...n,name:newName}:n));
      updatePerson(id,{name:newName});
    }
  }

  async function addCategory(name, color){
    setSaving(true);
    try{
      const isSubCat=centerNode?.type==="category";
      const parentId=isSubCat?centerNode.id:"me";
      // Check if category already exists
      const existing=nodes.find(n=>n.id===name&&n.type==="category");
      if(!existing){
        await callBackend("addCategory",{name,color});
        const newCat={id:name,name,type:"category",color:color||DEFAULT_CAT_COLORS[name]||hashColor(name)};
        setNodes(prev=>[...prev,newCat]);
      }
      // Add the link (sub-cat or top-level)
      const linkType=isSubCat?"subcategory":"circle";
      const linkExists=links.some(l=>l.source===parentId&&l.target===name);
      if(!linkExists){
        setLinks(prev=>[...prev,{source:parentId,target:name,type:linkType}]);
        if(isSubCat){try{await callBackend("addRelationship",{personA:parentId,personB:name,type:"subcategory"});}catch(e){console.error(e);}}
      }
      setShowAddCategory(false);
    }catch(e){console.error(e);}finally{setSaving(false);}
  }
  async function saveQuickNote(personId,entry){setNodes(prev=>prev.map(n=>n.id===personId?{...n,about:[...n.about,entry]}:n));setShowQuickNote(false);setSaving(true);try{const r=await callBackend("addAbout",{personId,date:entry.date,text:entry.text});setNoteId(personId,entry,r.id);}catch(e){console.error(e);}finally{setSaving(false);}}
  // Notes get their real id from the server after saving, so they can be edited/deleted later
  function setNoteId(ownerId,entry,id){
    if(!id)return;
    setNodes(prev=>prev.map(n=>n.id!==ownerId?n:{...n,about:(n.about||[]).map(e=>(!e.id&&e.date===entry.date&&e.text===entry.text)?{...e,id}:e)}));
  }
  async function editNote(ownerId,note,patch){
    setNodes(prev=>prev.map(n=>n.id!==ownerId?n:{...n,about:(n.about||[]).map(e=>e===note||(note.id&&e.id===note.id)?{...e,...patch}:e)}));
    if(!note.id)return;
    setSaving(true);try{await callBackend("updateAbout",{id:note.id,...patch});}catch(e){console.error(e);}finally{setSaving(false);}

  // ===== Collections actions =====
  async function createItem(collectionKey,name,fields){
    const res=await callBackend("addItem",{collection:collectionKey,name,fields});const id=res.id;
    const def=collectionDef(collectionKey);
    setNodes(prev=>[...prev,{id,name,type:"item",collection:collectionKey,fields,about:[],icon:def.icon}]);
    setLinks(prev=>[...prev,{source:collectionNodeId(collectionKey),target:id,type:"item"}]);
    return id;
  }
  async function addItem(collectionKey,name,fields){
    setSaving(true);
    try{
      const id=await createItem(collectionKey,name,fields);
      setAddItemFor(null);setNewNodeId(id);setTimeout(()=>setActiveItemId(id),100);setTimeout(()=>setNewNodeId(null),2000);
    }catch(e){console.error(e);alert("Couldn't save: "+e.message);}finally{setSaving(false);}
  }
  // ===== To-do actions =====
  function realTaskId(id){return taskIdRef.current[id]||Promise.resolve(id);}
  async function addTask(text){
    const tmp="tmp_"+Date.now();
    setTasks(prev=>[{id:tmp,text,done:false,doneAt:"",createdAt:new Date().toISOString()},...prev]);
    const p=callBackend("addTask",{text}).then(r=>r.id);taskIdRef.current[tmp]=p;
    setSaving(true);
    try{const id=await p;setTasks(prev=>prev.map(t=>t.id===tmp?{...t,id}:t));}
    catch(e){console.error(e);setTasks(prev=>prev.filter(t=>t.id!==tmp));alert("Couldn't save the task");}
    finally{setSaving(false);}
  }
  async function toggleTask(id,done){
    setTasks(prev=>prev.map(t=>t.id===id?{...t,done,doneAt:done?new Date().toISOString():""}:t));
    try{await callBackend("updateTask",{id:await realTaskId(id),done});}catch(e){console.error(e);}
  }

    setTasks(prev=>prev.map(t=>t.id===id?{...t,text}:t));
    try{await callBackend("updateTask",{id:await realTaskId(id),text});}catch(e){console.error(e);}

  async function addFieldDef(def){setFieldDefs(prev=>[...prev,def]);try{await callBackend("addFieldDef",{id:def.id,label:def.label,type:def.type,important:false});}catch(e){console.error(e);}}

  async function handleAISave(action){
    if(action.type==="about"){const entry={date:action.date||new Date().toISOString().slice(0,10),text:action.text};setNodes(prev=>prev.map(n=>n.id===action.personId?{...n,about:[...(n.about||[]),entry]}:n));const r=await callBackend("addAbout",{personId:action.personId,date:entry.date,text:entry.text});setNoteId(action.personId,entry,r.id);}
    else if(action.type==="item"&&collectionDef(action.collection)&&action.name){
      const def=collectionDef(action.collection);
      const fields={};Object.entries(action.fields||{}).forEach(([k,v])=>{if([...def.fixed,...def.optional].some(f=>f.key===k)&&v)fields[k]=String(v);});
      const id=await createItem(action.collection,action.name,fields);
      if(action.note)await addItemNote(id,{date:new Date().toISOString().slice(0,10),text:action.note});
      if(def.people)for(const pid of (action.linkPeople||[])){if(nodes.some(n=>n.id===pid&&n.type==="person"))await linkItemPerson(id,pid,def.people.type);}
    }
    else if(action.type==="itemNote"&&nodes.some(n=>n.id===action.itemId)){await addItemNote(action.itemId,{date:action.date||new Date().toISOString().slice(0,10),text:action.text});}
    else if(action.type==="birthday"){setNodes(prev=>prev.map(n=>n.id===action.personId?{...n,birthday:action.date}:n));await callBackend("updatePerson",{id:action.personId,birthDate:action.date});}
    else if(action.type==="field"){let fd=fieldDefs.find(f=>f.label.toLowerCase()===action.fieldLabel.toLowerCase());if(!fd){const newId="f"+Date.now();fd={id:newId,label:action.fieldLabel,type:"text"};setFieldDefs(prev=>[...prev,fd]);await callBackend("addFieldDef",{id:newId,label:fd.label,type:"text",important:false});}setNodes(prev=>prev.map(n=>n.id===action.personId?{...n,customValues:{...(n.customValues||{}),[fd.id]:action.value}}:n));await callBackend("setFieldValue",{personId:action.personId,fieldId:fd.id,value:action.value});}
  }

  // Breadcrumb = navStack + centerId, all as ids
  const breadcrumb=centerId==="me"?[...navStack,"me"]:[...navStack,centerId];
  const searchResults=search.trim()?nodes.filter(n=>(n.type==="person"||n.type==="category"||n.type==="item")&&n.name.toLowerCase().includes(search.toLowerCase())):[];

  if(loading)return <LoadingScreen/>;
  if(loadError)return <ErrorScreen message={loadError} onRetry={loadData}/>;

  return(
    <div ref={containerRef} style={{width:"100%",height:"100dvh",background:P.bg,color:P.text,fontFamily:"'Inter','Segoe UI',sans-serif",position:"relative",overflow:"hidden"}}>
      {dims.width>0&&<Graph
        centerId={centerId} allNodes={nodes} allLinks={links}
