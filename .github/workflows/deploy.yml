name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject backend URL into index.html
        # Only the Apps Script URL is injected. Passwords and API keys live in
        # Apps Script > Project Settings > Script Properties, never in this page.
        run: |
          sed -i "s|%%APPS_SCRIPT_URL%%|${{ secrets.APPS_SCRIPT_URL }}|g" index.html
          # Inject build timestamp so browsers never serve a stale cached version
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          sed -i "s|%%BUILD_TIME%%|${BUILD_TIME}|g" index.html

      - name: Deploy to gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Save the built index.html
          cp index.html /tmp/index_built.html
          # Switch to gh-pages branch (create if needed)
          git fetch origin gh-pages 2>/dev/null || true
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages
          # Remove everything except .git
          git rm -rf . --quiet 2>/dev/null || true
          # Put the built file back
          cp /tmp/index_built.html index.html
          git add index.html
          git commit -m "deploy: $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "Nothing to commit"
          git push origin gh-pages --force
