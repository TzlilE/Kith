      />}
      {saving&&<div style={{position:"absolute",top:12,right:12,fontSize:11,color:P.muted,background:P.surface,padding:"4px 10px",borderRadius:8,zIndex:50,border:`1.5px solid ${P.border}`,boxShadow:`0 1px 4px ${P.shadow}`}}>Saving…</div>}

      {/* Reminder Banner */}
      {activeReminders.length>0&&<ReminderBanner reminders={activeReminders} onDismiss={handleDismissReminder} onSnooze={handleSnoozeReminder} onPersonClick={(personId)=>{setActiveCardId(personId);}}/>}

      {/* Top bar */}
      <div style={{position:"absolute",top:activeReminders.length>0?bannerHeight:0,left:0,right:panelWidth,padding:"14px 20px",display:"flex",alignItems:"center",gap:10,background:`linear-gradient(to bottom, ${P.gradTop} 60%, transparent)`,zIndex:10,transition:"top 0.3s ease"}}>
        {!isHome&&<button onClick={goBack} style={{width:34,height:34,borderRadius:10,background:P.surface,border:`1.5px solid ${P.border}`,color:P.text,fontSize:15,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,boxShadow:`0 1px 4px ${P.shadow}`}}>←</button>}
        <div style={{display:"flex",alignItems:"center",gap:6,fontSize:13,color:P.muted,flex:1,overflow:"hidden"}}>
          {!isHome&&breadcrumb.map((id,i)=>{const n=nodes.find(x=>x.id===id);const label=id==="me"?"kith":(n?.name?.split(" ")[0]||id);const isLast=i===breadcrumb.length-1;return(<span key={i} style={{display:"flex",alignItems:"center",gap:6,whiteSpace:"nowrap"}}>{isLast?<span style={{color:P.text,fontWeight:600}}>{label}</span>:<button onClick={()=>{setNavStack(breadcrumb.slice(0,i));setCenterId(id);setActiveCardId(null);setShowMeCard(false);}} style={{background:"none",border:"none",cursor:"pointer",color:P.muted,fontSize:13,padding:0,fontFamily:"inherit",textDecoration:"underline",textDecorationColor:P.border}}>{label}</button>}{!isLast&&<span style={{opacity:0.4}}>→</span>}</span>);})}
          {isHome&&<img src={KITH_LOGO} alt="Kith" style={{height:32,width:"auto",mixBlendMode:"multiply",opacity:0.92}}/>}
        </div>
        <button aria-label="To do" onClick={()=>setShowTodo(true)} style={{position:"relative",width:34,height:34,borderRadius:10,background:P.surface,border:`1.5px solid ${P.border}`,color:P.text,fontSize:16,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:`0 1px 4px ${P.shadow}`,flexShrink:0}}>✓{openTaskCount>0&&<span style={{position:"absolute",top:-5,right:-5,background:P.youStroke,color:"white",borderRadius:9,minWidth:16,height:16,padding:"0 4px",fontSize:9,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>{openTaskCount}</span>}</button>
        {centerNode?.type==="person"&&<button onClick={()=>setActiveCardId(centerNode.id)} style={{width:34,height:34,borderRadius:10,background:P.surface,border:`1.5px solid ${P.border}`,color:P.muted,fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:`0 1px 4px ${P.shadow}`}}>👤</button>}
        {centerNode?.type==="collection"&&<button aria-label="Color" onClick={()=>setColorSheetNode(centerNode)} style={{width:34,height:34,borderRadius:10,background:P.surface,border:`1.5px solid ${P.border}`,color:P.text,fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:`0 1px 4px ${P.shadow}`}}>🎨</button>}
        {centerColKey==="places"&&<button aria-label="Map" onClick={()=>setShowPlacesMap(true)} style={{width:34,height:34,borderRadius:10,background:P.surface,border:`1.5px solid ${P.border}`,color:P.text,fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:`0 1px 4px ${P.shadow}`}}>🗺</button>}
        {centerColKey&&<button onClick={()=>setAddItemFor(centerColKey)} style={{width:34,height:34,borderRadius:10,background:P.surface,border:`1.5px solid ${P.border}`,color:P.text,fontSize:20,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:`0 1px 4px ${P.shadow}`}}>+</button>}
        {centerNode?.type!=="category"&&centerNode?.type!=="collection"&&centerNode?.type!=="item"&&<button onClick={()=>setAddModalCenter(centerNode||nodes.find(n=>n.id==="me"))} style={{width:34,height:34,borderRadius:10,background:P.surface,border:`1.5px solid ${P.border}`,color:P.text,fontSize:20,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:`0 1px 4px ${P.shadow}`}}>+</button>}
        {(isHome||centerNode?.type==="category")&&<button onClick={()=>setShowAddCategory(true)} style={{width:34,height:34,borderRadius:10,background:P.surface,border:`1.5px solid ${P.border}`,color:P.muted,fontSize:13,fontWeight:700,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:`0 1px 4px ${P.shadow}`}}>⊕</button>}
        {isHome&&uncategorizedPeople.length>0&&<button onClick={()=>setShowUncategorized(true)} style={{position:"relative",width:34,height:34,borderRadius:10,background:P.surface,border:`1.5px solid ${P.border}`,color:P.muted,fontSize:14,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:`0 1px 4px ${P.shadow}`}}>👤<span style={{position:"absolute",top:-5,right:-5,background:P.youStroke,color:"white",borderRadius:"50%",width:16,height:16,fontSize:9,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>{uncategorizedPeople.length}</span></button>}
      </div>


      {/* Home bottom bar */}
      {isHome&&!editMode&&(
        <div style={{position:"absolute",bottom:0,left:0,right:0,padding:"14px 20px 40px",background:`linear-gradient(to top, ${P.gradBot} 65%, transparent)`,zIndex:10}}>

          {/* Nudge pill — show first upcoming nudge if no search */}
          {!search&&(()=>{
            // find the person with longest time since last contact
            const candidates=nodes.filter(n=>n.type==="person"&&daysSinceLastAbout(n)!==null);
            if(candidates.length===0)return null;
            const person=candidates.sort((a,b)=>(daysSinceLastAbout(b)||0)-(daysSinceLastAbout(a)||0))[0];
            const days=daysSinceLastAbout(person);
            if(!days||days<14)return null;
            return(
              <div onClick={()=>setActiveCardId(person.id)} style={{display:"flex",alignItems:"center",gap:10,background:P.nudgeBg,border:`1.5px solid ${P.nudgeBorder}`,borderRadius:16,padding:"10px 14px",marginBottom:10,cursor:"pointer",boxShadow:`0 2px 8px ${P.shadow}`}}>
                <div style={{width:8,height:8,borderRadius:"50%",background:P.nudgeDot,flexShrink:0}}/>
                <div style={{fontSize:13,color:P.text,fontWeight:500,flex:1,lineHeight:1.35}}>You haven't talked to <strong>{person.name.split(" ")[0]}</strong> in {days} days 👋</div>
                <span style={{fontSize:14,color:P.muted}}>›</span>
              </div>
            );
          })()}


          {/* Search bar + floating results */}
          {search!==undefined&&(
            <div style={{position:"relative",marginBottom:8}}>
              {/* Floating search results — appear ABOVE the bar, don't push layout */}
              {searchResults.length>0&&(
                <div style={{position:"absolute",bottom:"100%",left:0,right:0,marginBottom:6,background:P.surface,border:`1.5px solid ${P.border}`,borderRadius:14,overflow:"hidden",boxShadow:`0 -4px 16px ${P.shadow}`,zIndex:20,maxHeight:240,overflowY:"auto"}}>
                  {searchResults.map(n=>{
                    const isCat=n.type==="category";
                    // For a person, find their parent category to navigate there first
                    const parentLink=!isCat&&links.find(l=>{const other=l.source===n.id?l.target:l.target===n.id?l.source:null;return other&&nodes.find(x=>x.id===other)?.type==="category";});
                    const parentCatId=parentLink?(parentLink.source===n.id?parentLink.target:parentLink.source):null;
                    return(<div key={n.id} onClick={()=>{
                      setSearch("");
                      if(n.type==="item"){navigateTo(collectionNodeId(n.collection));setActiveItemId(n.id);return;}
                      if(isCat){navigateTo(n.id);}
                      else if(parentCatId){navigateTo(parentCatId);setActiveCardId(n.id);}
                      else{setActiveCardId(n.id);}
                    }} style={{padding:"11px 16px",borderBottom:`1px solid ${P.borderSoft}`,fontSize:14,cursor:"pointer",display:"flex",alignItems:"center",gap:10,color:P.text,background:P.surface}}>
                      <div style={{width:28,height:28,borderRadius:"50%",background:`${isCat?(n.color||"#A896C8"):personBaseColor(n.id,links,nodes)}25`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,color:isCat?(n.color||"#A896C8"):personBaseColor(n.id,links,nodes)}}>{n.name[0]}</div>
                      <div style={{flex:1}}>{n.name}</div>
                      <span style={{fontSize:11,color:P.muted}}>{n.type==="item"?(collectionDef(n.collection)?.singular||"item"):isCat?"category":"person"}</span>
                    </div>);
                  })}
                </div>
              )}
              <div style={{display:"flex",alignItems:"center",gap:8,background:P.surface,border:`1.5px solid ${search?P.selected:P.border}`,borderRadius:16,padding:"8px 14px",boxShadow:`0 1px 6px ${P.shadow}`,transition:"border-color 0.2s"}}>
                <svg width="15" height="15" viewBox="0 0 15 15" fill="none" style={{flexShrink:0}}><circle cx="6.5" cy="6.5" r="5" stroke={P.muted} strokeWidth="1.6"/><line x1="10.5" y1="10.5" x2="14" y2="14" stroke={P.muted} strokeWidth="1.6" strokeLinecap="round"/></svg>
                <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search" style={{flex:1,background:"transparent",border:"none",outline:"none",fontSize:14,color:P.text,fontFamily:"inherit"}}/>
                {search&&<button onClick={()=>setSearch("")} style={{background:"none",border:"none",color:P.muted,fontSize:16,cursor:"pointer",padding:0,lineHeight:1}}>✕</button>}
              </div>
            </div>
          )}
          {/* AI chat bar */}
          <div onClick={()=>setShowAIChat(true)} style={{display:"flex",alignItems:"center",gap:10,background:P.aiBarBg,border:`1.5px solid ${P.aiBarBorder}`,borderRadius:20,padding:"10px 14px",boxShadow:`0 2px 16px rgba(180,140,220,0.13)`,cursor:"pointer"}}>
            <div style={{width:30,height:30,borderRadius:"50%",background:`linear-gradient(135deg,${P.aiIcon1},${P.aiIcon2})`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,flexShrink:0}}>✦</div>
            <div style={{flex:1,fontSize:14,color:P.muted,userSelect:"none"}}>Tell me about someone…</div>
          </div>
        </div>
      )}

      {/* Non-home bottom: quick add */}
      {!isHome&&!editMode&&(
        <div style={{position:"absolute",bottom:0,left:0,right:0,padding:"14px 20px 40px",background:`linear-gradient(to top, ${P.gradBot} 60%, transparent)`,zIndex:10}}>
          <div style={{display:"flex",gap:8}}>
            {centerNode?.type==="item"
              ? <button onClick={()=>setActiveItemId(centerNode.id)} style={{...pbtn("primary"),flex:1,fontSize:15,padding:13,borderRadius:14,boxShadow:`0 2px 8px ${P.shadow}`}}>✎ Open {centerNode.name}</button>
              : centerColKey
              ? <button onClick={()=>setAddItemFor(centerColKey)} style={{...pbtn("primary"),flex:1,fontSize:15,padding:13,borderRadius:14,boxShadow:`0 2px 8px ${P.shadow}`}}>+ Add {collectionDef(centerColKey).singular}</button>
              : centerNode?.id==="collections"
              ? <div style={{flex:1,fontSize:13,color:P.muted,display:"flex",alignItems:"center",justifyContent:"center"}}>Tap Books, Places or Recipes</div>
              : centerNode?.type==="person"
              ? <button onClick={()=>setActiveCardId(centerNode.id)} style={{...pbtn("primary"),flex:1,fontSize:15,padding:13,borderRadius:14,boxShadow:`0 2px 8px ${P.shadow}`}}>✎ Edit {centerNode.name.split(" ")[0]}</button>
              : <button onClick={()=>setAddModalCenter(centerNode||nodes.find(n=>n.id==="me"))} style={{...pbtn("primary"),flex:1,fontSize:15,padding:13,borderRadius:14,boxShadow:`0 2px 8px ${P.shadow}`}}>+ Add person</button>
            }
            <button onClick={()=>setShowAIChat(true)} style={{width:50,height:50,borderRadius:14,background:P.aiBarBg,border:`1.5px solid ${P.aiBarBorder}`,color:P.text,fontSize:18,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,boxShadow:`0 2px 8px ${P.shadow}`}}>✦</button>
          </div>
        </div>
      )}

      {showUncategorized&&<UncategorizedDrawer people={uncategorizedPeople} allNodes={nodes} allLinks={links} onClose={()=>setShowUncategorized(false)} onSelectPerson={id=>{setActiveCardId(id);}}/>}
      {showMeCard&&(<><div onClick={()=>setShowMeCard(false)} style={{position:"absolute",inset:0,zIndex:15}}/><MeCard me={meNode} stats={stats} allNodes={nodes} onClose={()=>setShowMeCard(false)} onUpdate={updatePerson}/></>)}
      {activePerson&&(<>{!isDesktop&&<div onClick={()=>setActiveCardId(null)} style={{position:"absolute",inset:0,zIndex:15,background:"rgba(61,32,48,0.15)"}}/>}<PersonCard person={nodes.find(n=>n.id===activeCardId)||activePerson} allNodes={nodes} allLinks={links} fieldDefs={fieldDefs} onClose={()=>setActiveCardId(null)} onNavigate={navigateTo} onUpdate={updatePerson} onAddFieldDef={addFieldDef} onDelete={deletePerson} isSidePanel={isDesktop} saving={saving}/></>)}
      {activeItem&&!activePerson&&(<>{!isDesktop&&<div onClick={()=>setActiveItemId(null)} style={{position:"absolute",inset:0,zIndex:15,background:"rgba(61,32,48,0.15)"}}/>}<ItemCard key={activeItem.id} item={activeItem} allNodes={nodes} allLinks={links} onClose={()=>setActiveItemId(null)} onNavigate={navigateTo} onUpdate={updateItem} onAddNote={addItemNote} onEditNote={editNote} onDeleteNote={deleteNote} onLinkPerson={linkItemPerson} onUnlinkPerson={unlinkItemPerson} onDelete={deleteItem} isSidePanel={isDesktop} saving={saving}/></>)}
      {showTodo&&<TodoSheet tasks={tasks} onAdd={addTask} onToggle={toggleTask} onEdit={editTask} onDelete={deleteTask} onClose={()=>setShowTodo(false)}/>}
      {colorSheetNode&&<CollectionColorSheet node={nodes.find(n=>n.id===colorSheetNode.id)||colorSheetNode} onPick={changeCollectionColor} onClose={()=>setColorSheetNode(null)}/>}
      {showPlacesMap&&<PlacesMap places={nodes.filter(n=>n.type==="item"&&n.collection==="places")} onClose={()=>setShowPlacesMap(false)} onOpen={id=>{setShowPlacesMap(false);setActiveItemId(id);}} onSaveCoords={(id,c)=>{const it=nodes.find(n=>n.id===id);if(it)updateItem(id,{fields:{...(it.fields||{}),lat:String(c.lat),lng:String(c.lng)}});}}/>}
      {addItemFor&&<AddItemModal collectionKey={addItemFor} onSave={addItem} onCancel={()=>setAddItemFor(null)}/>}
      {showQuickNote&&<QuickNoteModal allNodes={nodes} onSave={saveQuickNote} onCancel={()=>setShowQuickNote(false)}/>}
      {showAIChat&&<AIChatModal allNodes={nodes} onSave={handleAISave} onCancel={()=>setShowAIChat(false)}/>}
      {addModalCenter&&<AddPersonModal centerNode={addModalCenter} allNodes={nodes} onSave={addPerson} onOpenExisting={id=>{setAddModalCenter(null);setActiveCardId(id);}} onCancel={()=>setAddModalCenter(null)}/>}
      {showAddCategory&&<AddCategoryModal onSave={addCategory} onCancel={()=>setShowAddCategory(false)}/>}
      {editSheetNode&&<EditSheet node={editSheetNode} allNodes={nodes} onClose={()=>setEditSheetNode(null)} onRename={renameNode} onChangeColor={changeCategoryColor} onDeleteCategory={deleteCategory} onDeletePerson={deletePerson} onAddPerson={n=>{setAddModalCenter(n);}} onAddSubCategory={()=>setShowAddCategory(true)}/>}
    </div>
  );
}

// ===== Root =====
function Root(){const[unlocked,setUnlocked]=useState(localStorage.getItem(LS_UNLOCKED)==="1"&&!!getKey());if(!unlocked)return <LockScreen onUnlock={()=>setUnlocked(true)}/>;return <MainApp/>;}
ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script>
</body>
</html>
